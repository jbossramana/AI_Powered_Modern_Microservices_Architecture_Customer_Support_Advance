model_list:
  - model_name: llama3.2
    litellm_params:
      model: ollama/llama3.2:latest
      api_base: http://127.0.0.1:11434
      timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  allowed_fails: 3
  cooldown_time: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  disable_spend_logs: true
